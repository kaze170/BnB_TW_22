<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>爆爆王 Crazy Arcade</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      #stage-shell {
        position: relative;
        width: min(100vw, calc(100vh * 4 / 3));
        max-width: 800px;
        max-height: 600px;
        aspect-ratio: 4 / 3;
        overflow: hidden;
        background: #000000;
      }
      #bnb-canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: none;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #boot-status {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        text-align: center;
        color: #ffffff;
        font-size: 12px;
        font-family: "PMingLiU", "MingLiU", "Microsoft JhengHei", sans-serif;
        background: #000000;
      }
    </style>
  </head>
  <body>
    <div id="stage-shell">
      <canvas id="bnb-canvas" width="800" height="600"></canvas>
      <div id="boot-status">Loading Crazy Arcade...</div>
    </div>
    <script type="module" src="/dist/client.js"></script>
  </body>
</html>
